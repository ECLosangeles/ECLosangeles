name: Deploy Sanity Studio

on:
  push:
    branches:
      - main
    paths:
      - 'studio-eclosangeles/**'
      - '.github/workflows/deploy-sanity-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanity-studio-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Studio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio-eclosangeles
    env:
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
      # Origin the Presentation tool loads in its preview pane. Set the
      # SITE_ORIGIN repository variable to the deployed website's URL
      # (Settings → Secrets and variables → Actions → Variables). Without it the
      # deployed Studio falls back to http://localhost:3000, which only previews
      # for editors running the site locally.
      SANITY_STUDIO_PREVIEW_ORIGIN: ${{ vars.SITE_ORIGIN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: studio-eclosangeles/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Sanity
        run: npm run deploy -- --yes --url=eclosangeles
